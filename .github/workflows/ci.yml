name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm -v
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix['node-version'] }}
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          if [ "$(node -v | cut -d. -f1 | sed 's/v//')" -ge 20 ]; then
            npm i -g npm@11.12.1
          fi
          npm -v

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm run test:run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
