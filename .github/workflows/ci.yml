name: CI

on:
  push:
    branches: [main]
    tags: ["v1.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install script policy
        run: npm run verify:install-scripts

      - name: Dependency audit
        run: npm run audit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm run test:run

      - name: Runtime artifact security tests
        run: npm run test:runtime-artifact

      - name: Install promotion isolation dependency
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Promotion interruption and rollback tests
        run: npm run test:promotion-recovery

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci

      - name: Axe accessibility smoke checks
        run: npm run a11y

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install script policy
        run: npm run verify:install-scripts

      - name: Shared shim verification
        run: npm run verify:shared-shims

      - name: Public verification dispatch dry run
        run: npm run verify:public:dispatch -- --dry-run --expected-release ci --expected-commit-sha "$GITHUB_SHA"

      - name: Production host environment contract
        env:
          COFOUNDRY_COMMIT_SHA: ${{ github.sha }}
          COFOUNDRY_DEPLOYED_AT: "2026-01-01T00:00:00.000Z"
          COFOUNDRY_LOCAL_DATA_DIR: /var/lib/cofoundry
          COFOUNDRY_OPERATIONS_TOKEN: synthetic-ci-worker-token-at-least-32
          COFOUNDRY_RELEASE: ci
          NODE_ENV: production
          NUXT_PUBLIC_APP_URL: https://cofoundry.example.com
          NUXT_PUBLIC_BACKEND_MODE: mock
          NUXT_PUBLIC_BILLING_MODE: mock
          NUXT_PUBLIC_ENABLE_DEMO_ACCESS: "false"
          SESSION_SIGNING_SECRET: synthetic-ci-session-signing-secret
        run: npm run verify:host-env -- --production --fail-on-warnings

      - name: Build
        env:
          COFOUNDRY_COMMIT_SHA: ${{ github.sha }}
          COFOUNDRY_DEPLOYED_AT: "2026-01-01T00:00:00.000Z"
          COFOUNDRY_OPERATIONS_TOKEN: synthetic-ci-build-operations-token-0001
          NODE_ENV: production
          NUXT_PUBLIC_APP_URL: https://cofoundry.example.com
          NUXT_PUBLIC_BACKEND_MODE: mock
          NUXT_PUBLIC_BILLING_MODE: mock
          NUXT_PUBLIC_ENABLE_DEMO_ACCESS: "false"
          SESSION_SIGNING_SECRET: synthetic-ci-build-session-secret-000001
        run: npm run build

      - name: Deployment identity fallback verification
        run: npm run verify:deployment-identity

      - name: Analytics output verification
        run: npm run verify:analytics

      - name: Production smoke verification
        run: npm run verify:production

      - name: Public route smoke verification
        run: npm run verify:public:local

      - name: Production accessibility smoke checks
        run: npm run a11y:production

  native-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.') && github.repository == 'anderson-webops/cofoundry.jacobdanderson.net'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@12.0.2 --allow-scripts=npm
          test "$(npm --version)" = 12.0.2

      - name: Verify annotated source tag
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          test -z "$(git status --porcelain)"

      - name: Install isolated acceptance dependency
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Build and accept exact Linux ARM64 runtime
        run: |
          printf '/.ai-work/\n' >> .git/info/exclude
          mkdir -p .ai-work/runs/ci-artifact-release
          git check-ignore -q .ai-work/runs/ci-artifact-release
          npm run package:runtime -- "$PWD/.ai-work/runs/ci-artifact-release"
          cd .ai-work/runs/ci-artifact-release
          sha256sum --check SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          jq -e --arg commit "$GITHUB_SHA" \
            '.commit == $commit and .hostControlBundle.commit == $commit and (.checks | length) >= 10' \
            acceptance.json
          jq -e --arg commit "$GITHUB_SHA" '.commit == $commit' runtime-manifest.json

      - name: Retain accepted release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: cofoundry-runtime-${{ github.sha }}
          path: |
            .ai-work/runs/ci-artifact-release/cofoundry-*.tar.gz
            .ai-work/runs/ci-artifact-release/runtime-manifest.json
            .ai-work/runs/ci-artifact-release/acceptance.json
            .ai-work/runs/ci-artifact-release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish-runtime:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.') && github.repository == 'anderson-webops/cofoundry.jacobdanderson.net'
    needs: [lint, typecheck, audit, test, test-e2e, accessibility, build, native-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
        with:
          name: cofoundry-runtime-${{ github.sha }}
          path: release-assets

      - name: Verify downloaded runtime and control archives
        run: |
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5
          (cd release-assets && sha256sum --check SHA256SUMS)
          runtime_archive=$(jq -r '.archive' release-assets/acceptance.json)
          runtime_sha=$(jq -r '.sha256' release-assets/acceptance.json)
          control_archive=$(jq -r '.hostControlBundle.archive' release-assets/acceptance.json)
          control_sha=$(jq -r '.hostControlBundle.sha256' release-assets/acceptance.json)
          mkdir "$RUNNER_TEMP/cofoundry-unpacked"
          python3 -B scripts/runtime-artifact.py unpack "$RUNNER_TEMP/cofoundry-unpacked" \
            --archive "release-assets/$runtime_archive" --sha256 "$runtime_sha" --commit "$GITHUB_SHA"
          cmp release-assets/runtime-manifest.json "$RUNNER_TEMP/cofoundry-unpacked/runtime-manifest.json"
          python3 -B scripts/host-control-bundle.py verify \
            --archive "release-assets/$control_archive" --sha256 "$control_sha" --commit "$GITHUB_SHA"

      - name: Attest exact release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Publish immutable release after asset comparison
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its assets.' >&2
            exit 1
          fi
          cp "${{ steps.attest.outputs.bundle-path }}" release-assets/attestation-bundle.jsonl
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          notes_file="$RUNNER_TEMP/cofoundry-release-notes.md"
          printf 'Verified Linux ARM64 runtime and host-control bundles for %s at %s.\n\nCI accepted the exact unpacked runtime, required paths, dependency closure, missing-module rejection, and promotion recovery. Production activation remains server-owned.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" > "$notes_file"
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          mkdir "$RUNNER_TEMP/cofoundry-release-download"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/cofoundry-release-download"
          test "$(find "$RUNNER_TEMP/cofoundry-release-download" -maxdepth 1 -type f | wc -l)" -eq 6
          for asset in release-assets/*; do
            cmp "$asset" "$RUNNER_TEMP/cofoundry-release-download/$(basename "$asset")"
          done
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
