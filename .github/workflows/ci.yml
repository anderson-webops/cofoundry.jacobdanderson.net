name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Dependency audit
        run: npm run audit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm run test:run

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Axe accessibility smoke checks
        run: npm run a11y

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.12.1
          npm -v

      - name: Install deps
        run: npm ci

      - name: Shared shim verification
        run: npm run verify:shared-shims

      - name: Public verification dispatch dry run
        run: npm run verify:public:dispatch -- --dry-run --expected-release ci --expected-commit-sha "$GITHUB_SHA"

      - name: Build
        run: npm run build

      - name: Deployment identity fallback verification
        run: npm run verify:deployment-identity

      - name: Analytics output verification
        run: npm run verify:analytics

      - name: Production smoke verification
        run: npm run verify:production

      - name: Public route smoke verification
        run: npm run verify:public:local

      - name: Production accessibility smoke checks
        run: npm run a11y:production
