name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install script policy
        run: npm run verify:install-scripts

      - name: Dependency audit
        run: npm run audit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npm run test:run

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Axe accessibility smoke checks
        run: npm run a11y

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: npm

      - name: Pin npm version
        run: |
          npm i -g npm@11.16.0
          npm -v

      - name: Install deps
        run: npm ci

      - name: Install script policy
        run: npm run verify:install-scripts

      - name: Shared shim verification
        run: npm run verify:shared-shims

      - name: Public verification dispatch dry run
        run: npm run verify:public:dispatch -- --dry-run --expected-release ci --expected-commit-sha "$GITHUB_SHA"

      - name: Production host environment contract
        env:
          COFOUNDRY_COMMIT_SHA: ${{ github.sha }}
          COFOUNDRY_DEPLOYED_AT: "2026-01-01T00:00:00.000Z"
          COFOUNDRY_LOCAL_DATA_DIR: /var/lib/cofoundry
          COFOUNDRY_OPERATIONS_TOKEN: synthetic-ci-worker-token-at-least-32
          COFOUNDRY_RELEASE: ci
          NODE_ENV: production
          NUXT_PUBLIC_APP_URL: https://cofoundry.example.com
          NUXT_PUBLIC_BACKEND_MODE: mock
          NUXT_PUBLIC_BILLING_MODE: mock
          NUXT_PUBLIC_ENABLE_DEMO_ACCESS: "false"
          SESSION_SIGNING_SECRET: synthetic-ci-session-signing-secret
        run: npm run verify:host-env -- --production --fail-on-warnings

      - name: Build
        run: npm run build

      - name: Deployment identity fallback verification
        run: npm run verify:deployment-identity

      - name: Analytics output verification
        run: npm run verify:analytics

      - name: Production smoke verification
        run: npm run verify:production

      - name: Public route smoke verification
        run: npm run verify:public:local

      - name: Production accessibility smoke checks
        run: npm run a11y:production
