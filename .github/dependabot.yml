version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      front-end-deps:
        patterns:
          - "@nuxt*"
          - "@pinia*"
          - "@vite*"
          - "@vue*"
          - "@vueuse*"
          - "nuxt"
          - "pinia"
          - "unocss"
          - "vitest"
          - "vue"
          - "vue-tsc"
      back-end-deps:
        patterns:
          - "@supabase*"
          - "dotenv"
          - "stripe"
      tooling:
        patterns:
          - "@types*"
          - "eslint*"
          - "tsx"
          - "typescript"
